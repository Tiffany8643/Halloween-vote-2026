<title>Costume Vote 2026 · Results</title>
<style>
:root{--o100:#FDE8D8;--o200:#FCC396;--o300:#FE934C;--o500:#FF7214;--o700:#973C00;--o900:#522000;
--g100:#F4F4F4;--g200:#E5E5E5;--g300:#C5C5C5;--g500:#696969;--g700:#4A4A4A;--g900:#2A2A2A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:#fff;color:var(--g900);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px}
header img{height:34px;display:block}
h1{font-size:30px;margin:22px 0 4px}
.sub{color:var(--g500);margin:0 0 20px}
.gate{background:var(--o100);border-left:4px solid var(--o500);padding:16px;border-radius:0 10px 10px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{padding:11px 14px;border:1.5px solid var(--g300);border-radius:10px;font-size:16px}
.btn{background:var(--o500);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--o700)}
.btn.ghost{background:transparent;color:var(--g700);border:1.5px solid var(--g300)}
#res{display:none}
.kpi{display:flex;gap:12px;margin:18px 0}
.kpi div{background:var(--g100);border-radius:10px;padding:12px 16px;flex:1}
.kpi b{display:block;font-size:26px;color:var(--o500)}
.kpi span{font-size:13px;color:var(--g500)}
table{width:100%;border-collapse:collapse;margin:14px 0 26px;font-size:15px}
th{background:var(--o500);color:#fff;text-transform:uppercase;font-size:12px;letter-spacing:.04em;text-align:left;padding:10px 12px}
td{padding:10px 12px;border-bottom:1px solid var(--g200)}
tr:nth-child(even) td{background:var(--g100)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.win td:first-child{font-weight:700;color:var(--o700)}
.medal{display:inline-block;width:26px;height:26px;border-radius:50%;background:var(--o500);color:#fff;font-weight:800;font-size:13px;text-align:center;line-height:26px;margin-right:8px}
.medal.m2{background:var(--o300);color:var(--o900)}.medal.m3{background:var(--o200);color:var(--o900)}
h2{font-size:18px;margin:26px 0 6px;border-bottom:2px solid var(--o500);display:inline-block;padding-bottom:3px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.muted{color:var(--g500);font-size:13px}
</style>
</head>

  <h1>Costume Contest 2026 — Results</h1>
  <p class="sub">Points: 1st = 3, 2nd = 2, 3rd = 1. Top three totals win.</p>

  <div class="gate" id="gate">
    <span>Enter the results code:</span>
    <input type="password" id="pin" placeholder="code" autocomplete="off">
    <button class="btn" onclick="unlock()">Show results</button>
  </div>

  <div id="res">
    <div class="tools"><button class="btn ghost" onclick="load()">Refresh</button><span class="muted" id="stamp"></span></div>
    <div class="kpi"><div><b id="kBallots">0</b><span>ballots</span></div><div><b id="kEntries">0</b><span>costumes</span></div><div><b id="kLead">—</b><span>leading</span></div></div>
    <h2>Standings</h2>
    <table><thead><tr><th>Costume</th><th class="num">1st</th><th class="num">2nd</th><th class="num">3rd</th><th class="num">Points</th></tr></thead><tbody id="standings"></tbody></table>
    <h2>Ballots</h2>
    <table><thead><tr><th>Voter</th><th>1st</th><th>2nd</th><th>3rd</th><th>When</th></tr></thead><tbody id="ballots"></tbody></table>
  </div>
</div>
<script>
const SUPABASE_URL="https://yxejpzbsbwfovpumpjlw.supabase.co/rest/v1/hcv_votes";
const SUPABASE_KEY="sb_publishable_TXRcm05g4VHVX2Zews28hA_8D4L3HED";
const YEAR=2026;
const ENTRIES=[{"id": "emma", "name": "Emma Arch", "title": "Cruella de Vil (and her Dalmatian)"}, {"id": "sam", "name": "Sam Wells", "title": "Wrench to the head"}, {"id": "karen", "name": "Karen Hall", "title": "The Queen"}, {"id": "colleen", "name": "Colleen Banner", "title": "Uncrustable"}, {"id": "kaitlyn", "name": "Kaitlyn Cole", "title": "SPAM"}, {"id": "breanna", "name": "Breanna May", "title": "Brian, about to retire… in forever"}, {"id": "jaybob", "name": "Shannon Josselyn & Hannah Gill", "title": "Jay and Silent Bob (Clerks, Mallrats, Dogma: the Kevin Smith movies)"}, {"id": "nichole", "name": "Nichole Mock", "title": "This Is Fine (fire extinguisher included)"}, {"id": "shaun", "name": "Shaun", "title": "Hippie, complete with his own disco ball in receiving"}, {"id": "alex", "name": "Alex", "title": "Jack-of-all-pallets-o’-lantern"}, {"id": "andrew", "name": "Andrew", "title": "Mr. Halloween, back in the suit"}, {"id": "astro", "name": "Zach Miller", "title": "Astronaut, first man on the new showroom floor"}, {"id": "tigger", "name": "Nicole Summers", "title": "Tigger: T-I-double-guh-ER"}];
const CODE="1031";
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function nm(id){const e=ENTRIES.find(x=>x.id===id);return e?e.name:id;}
function unlock(){
  if(document.getElementById("pin").value.trim()!==CODE){alert("That's not it.");return;}
  document.getElementById("gate").style.display="none";document.getElementById("res").style.display="block";load();
}
document.getElementById("pin").addEventListener("keydown",e=>{if(e.key==="Enter")unlock();});
async function load(){
  const res=await fetch(SUPABASE_URL+"?year=eq."+YEAR+"&order=updated_at.desc",{headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}});
  const rows=await res.json();
  const tally={};ENTRIES.forEach(e=>tally[e.id]={f:0,s:0,t:0,p:0});
  rows.forEach(r=>{const add=(id,k,pts)=>{if(!tally[id])tally[id]={f:0,s:0,t:0,p:0};tally[id][k]++;tally[id].p+=pts;};add(r.first_pick,"f",3);add(r.second_pick,"s",2);add(r.third_pick,"t",1);});
  const order=Object.keys(tally).sort((a,b)=>tally[b].p-tally[a].p||tally[b].f-tally[a].f||tally[b].s-tally[a].s);
  document.getElementById("standings").innerHTML=order.map((id,i)=>{const t=tally[id];const medal=i<3&&t.p>0?`<span class="medal m${i+1}">${i+1}</span>`:"";return `<tr class="${i<3&&t.p>0?"win":""}"><td>${medal}${esc(nm(id))}</td><td class="num">${t.f}</td><td class="num">${t.s}</td><td class="num">${t.t}</td><td class="num"><b>${t.p}</b></td></tr>`;}).join("");
  document.getElementById("ballots").innerHTML=rows.map(r=>`<tr><td>${esc(r.voter_name)}</td><td>${esc(nm(r.first_pick))}</td><td>${esc(nm(r.second_pick))}</td><td>${esc(nm(r.third_pick))}</td><td class="muted">${new Date(r.updated_at).toLocaleString()}</td></tr>`).join("")||`<tr><td colspan="5" class="muted">No ballots yet.</td></tr>`;
  document.getElementById("kBallots").textContent=rows.length;
  document.getElementById("kEntries").textContent=ENTRIES.length;
  document.getElementById("kLead").textContent=rows.length?nm(order[0]).split(" ")[0]:"—";
  document.getElementById("stamp").textContent="Updated "+new Date().toLocaleTimeString();
}
</script>
